[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
nix = { version = "0.31", default-features = false, features = ["fs", "process", "signal", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "process", "rt", "signal"] }
