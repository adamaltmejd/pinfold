[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.5"
edition = "2024"
publish = false

[workspace.dependencies]
httparse = "1.10.1"
nix = { version = "0.31.3", default-features = false, features = ["feature", "fs", "poll", "process", "signal", "user"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tokio = { version = "1.53.3", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }

[profile.dev.package.sha2]
opt-level = 3
