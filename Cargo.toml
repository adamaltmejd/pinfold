[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.2.1"
edition = "2024"
publish = false

[workspace.dependencies]
httparse = "1"
nix = { version = "0.31", default-features = false, features = ["feature", "fs", "poll", "process", "signal", "user"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
