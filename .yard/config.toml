# Yard project configuration.
# Most keys that have a default are written out below, set to that default.
# The rest of what is written is this scaffold's own choice for a key that has
# none: the agent harnesses, models and efforts, the default workflow's
# implementer and its context window, the whole conflict job, and the review
# panel with its one seat.
# Commented lines are examples: a key, an agent, a job, or a workflow this
# project turns on by uncommenting it.
# Unknown keys are errors.

# max_lanes limits how many ready tickets run at once. It is one project-wide
# answer and belongs to no table, so it is written before the first one. On a
# machine that opted its containers into a memory share
# (YARD_CONTAINER_MEMORY=share in the machine's own operator.env), it also
# divides the Docker engine's memory between them: a share below the 512 MiB a
# worker needs is refused.
max_lanes = 2

# max_batch is the most approved candidates one merge batch verifies together.
# They are merged in approval order onto the target and gated once as one ref;
# a red batch is split in half and each half verified on its own, so a batch
# larger than the queue's usual depth costs nothing when it is green and one
# extra run per halving when it is not. A candidate that changes .yard is always
# verified alone.
max_batch = 8

# approve says whether a clean candidate needs a human to enqueue it. Under
# "manual" every candidate waits for your yes; under "auto" a candidate whose
# review is clean and whose changed paths are not protected is enqueued in the
# transaction that verifies it, and the merge queue gates it before it lands.
# A protected path, a residual acceptance and any change under .yard are always
# yours to answer.
approve = "auto"

[target]
# ref is the branch finished work lands on.
ref = "main"
# protected_paths names the paths that always take an operator's own decision,
# whatever approve says.
# .yard/ is protected whatever this list holds: a project can only add to that.
# The spec and the working rules: a design change is always the operator's.
# scripts/e2e-linux.sh is the e2e-linux gate's own body, run with the user's
# HOME: a candidate must not rewrite the gate that judges it unread.
protected_paths = ["docs/ARCHITECTURE.md", "AGENTS.md", "Cargo.toml", "Cargo.lock", ".github", "scripts/e2e-linux.sh"]

[isolation]
# dockerfile names the Dockerfile lanes and container gates are built from, as a
# path relative to the repository root.
dockerfile = ".yard/Dockerfile"

# An [agents.<name>] table is one reusable way of running a model, selected by
# name from the job tables below and from a workflow. Two of them selecting one
# agent share how the model is run and nothing else: what a job may write, what
# it is told, and how long it may run are keys of the job.
# Planning and conflicts run Opus on the claude harness (CLAUDE_CODE_OAUTH_TOKEN
# in operator.env). Implementation runs an open model on the pi harness through
# OpenRouter (OPENROUTER_API_KEY). The pi CLI has no subagents, so its agent
# declares them off.
[agents.opus]
harness = "claude"
model = "claude-opus-5-5"
effort = "high"
tools = { subagents = false }

[agents.deepseek]
harness = "pi"
provider = "openrouter"
model = "deepseek/deepseek-v4.1-flash"
effort = "max"
tools = { subagents = false }

# The planning job plans a plan-first ticket; without it, such a ticket waits
# for the operator. It takes the same keys as the conflict job below, and its
# instructions state what is true of this project only: Yard's own planning
# prompt carries the rest.
[planning]
agent = "opus"
access = "read-only"
instructions = "Plan against docs/ARCHITECTURE.md and the roadmap in README.md, and name the roadmap phase each ticket serves. Lanes are Linux containers without Apple container or podman, so no child can run the end-to-end suite; the operator runs it on the macOS host. Size each child to one module or one CLI verb plus the tests of the guarantees it completes, and name those guarantee numbers. A child that completes no guarantee names the child whose test exercises it."

# The conflict job resolves a conflicted retarget; without it, the lane stops
# for the operator. Every job table selects an agent by name and states what
# belongs to the job rather than to the agent.
[conflict]
# agent names one of the agents above.
agent = "opus"
# access grants the worker's workspace access: "writable" or "read-only".
access = "writable"
# inactivity_timeout_minutes restarts a generation that has emitted no event for
# that many minutes, in a fresh generation of the same session. The default, 0,
# disables it; a value is this project's longest legitimate silence.
inactivity_timeout_minutes = 0
# total_work_timeout_minutes is the attempt's whole budget in minutes, across
# every automatic restart, and nothing renews it.
total_work_timeout_minutes = 360

# Each [gates.<name>] section declares a gate every candidate must pass. Give
# each one a name of your own in place of "test".
# command is the gate, a shell command run as /bin/sh -c. A container gate runs
# it under env -i on a fixed floor, so none of the image's own ENV lines and no
# network reach it, and a toolchain installed off that floor's PATH, or one
# reading variables of its own, names them in the command itself: there is no
# environment key for a gate. See yard help daemon for that floor.
# timeout_minutes limits one run of the gate; the default is 30.
# stage is "batch", the default, or "candidate". Every gate runs on the merge
# queue's batch, against the tree that is about to land. A "candidate" gate runs
# on the worker's own head as well, before the review, so a cheap check answers
# before a reviewer is paid for.
# environment is "container", the default, or "host". A host gate must also name
# the platform ("darwin" or "linux") and the architecture ("arm64" or "x64") it
# needs.
# test_report is "junit", for a gate that writes JUnit XML to the
# $YARD_TEST_REPORT path Yard sets for it; left out, only the exit status is
# read.
# artifacts names the files the gate writes into the $YARD_ARTIFACT_DIR
# directory Yard sets for it and keeps in the execution's evidence, so they
# outlive the container and the view. Plain file names only, at most 16, and a
# declared file Yard cannot keep is a gate error naming it.
# [gates.test]
# command = "bun test"
# timeout_minutes = 30
# environment = "host"
# platform = "darwin"
# architecture = "arm64"
# test_report = "junit"
# artifacts = ["screenshot.png"]

# The Rust toolchain is installed under /usr/local, on the gate floor's PATH.
# The image pre-fetches the workspace's crates into /usr/local/cargo, which
# the gate floor does not name, so each command does.
[gates.fmt]
command = "CARGO_HOME=/usr/local/cargo cargo fmt --check"
timeout_minutes = 5
stage = "candidate"

[gates.clippy]
command = "CARGO_HOME=/usr/local/cargo cargo clippy --all-targets --locked --offline -- -D warnings"
timeout_minutes = 20
stage = "candidate"

# No credential in the candidate's history, not only its tree: a secret
# committed and then deleted still lands in git. trufflehog clones
# /workspace with its own git environment, so the safe.directory exception
# goes in the gate's global config ($HOME is /tmp on the floor).
# --no-verification because the gate has no network; --fail so any match
# fails the gate.
[gates.secrets]
command = "git config --global safe.directory '*' && trufflehog git file:///workspace --no-verification --no-update --fail"
timeout_minutes = 5
stage = "candidate"

# The end-to-end suite on Apple container. It runs on this Mac, batch-stage,
# on a candidate the review seat passed and the candidate gates cleared.
# Under approve = "auto" no human reads it first; the protected paths above
# and the seat's blocking list are the boundary (decided 2026-09-25). A host gate gets a fresh HOME, which
# rustup's cargo resolves its toolchain through, so the command names the
# user's real rustup and cargo homes. zig, cargo-zigbuild and container come
# from the daemon's PATH.
[gates.e2e-macos]
command = 'h=$(eval echo "~$(id -un)"); RUSTUP_HOME="$h/.rustup" CARGO_HOME="$h/.cargo" cargo test -p e2e --locked'
timeout_minutes = 15
stage = "batch"
environment = "host"
platform = "darwin"
architecture = "arm64"

# The Linux end-to-end suite, on GitHub's runners. The script pushes the
# batch head to a queue/<sha> branch, dispatches CI at it, waits for the
# verdict and deletes the branch, so nothing of the candidate runs on this
# Mac. Host-stage so it can reach the network and the user's gh login; the
# fresh HOME is replaced by the real one for git and gh only. If Actions
# minutes run short, an ephemeral self-hosted runner in a homelab VM takes
# over by changing the workflow's runs-on; this gate does not change.
[gates.e2e-linux]
command = 'h=$(eval echo "~$(id -un)"); HOME="$h" sh scripts/e2e-linux.sh'
timeout_minutes = 30
stage = "batch"
environment = "host"
platform = "darwin"
architecture = "arm64"

# Review runs on every candidate whose workflow selects a panel of seats.
[review]
# blocking is the priority at which a finding sends the candidate back for
# repair: "P0", "P1", "P2", or "P3", most severe first. It is this project's one
# truth about what blocks a candidate, whatever seats a workflow selects.
blocking = "P1"
# max_priority is the least severe finding reported, and must include blocking.
max_priority = "P3"
# max_rounds limits the autoreview rounds one attempt spends automatically: 1 to
# 5. A gate failure's repair round is not spent from it.
max_rounds = 5
# timeout_minutes limits one review run.
timeout_minutes = 30

# Each [review.reviewers.<name>] section declares one review seat: one reviewer,
# under a name a workflow selects it by. Name seats as you like.
[review.reviewers.code]
# engine, model and effort are the reviewer that fills the seat; a seat from a
# different engine family than the implementer is recommended.
engine = "pi"
# A pi seat takes effort up to "xhigh"; the review tool refuses "max".
model = "openrouter/meta/muse-spark-1.3-contributor"
effort = "xhigh"
# Jev skips this seat only when it is confident the diff is outside this scope;
# a change to .yard or a protected path always gets the full panel.
when = "The change touches program behavior: Rust source, tests, Cargo or toolchain files, the profile, a Containerfile, or CI."
instructions = "Judge the change against docs/ARCHITECTURE.md and AGENTS.md. Blocking: a weakened or missing security control, a secret that can reach argv or a log, a unit test or mock, and an end-to-end test that cannot fail (no positive control, or a pass on timeout). Also blocking, because the end-to-end gate runs the candidate on the operator's Mac: a build script, e2e code that reads or writes outside its own test directories and pinfold's state, and a network endpoint beyond the fixtures, api.github.com and example.com."
context = ["docs/ARCHITECTURE.md", "AGENTS.md"]
# instructions are one seat's own, appended verbatim to that seat's prompt and
# to no other's, up to 4096 bytes; changing them invalidates the review evidence
# recorded under the old text. A seat is given the change bundle -- the
# candidate's diff and the evidence Yard bundles with it -- and Yard runs
# neither this project nor its tooling for a review, so state a discipline the
# seat can judge from the diff:
#     instructions = "Judge changed interface code against the design system: spacing scale, color tokens, and a visible focus state on every interactive element."
# context lists the repository files this seat's reviewer is given beside the
# diff, up to 8, read as the candidate has them. Name the contract the
# instructions judge against -- a design system, a schema, a skill -- and
# nothing else. It is a list of files: never a directory, never a glob, and
# never anything under .yard/, which stays outside what a reviewer may read. A
# path the candidate does not track, or that its own ignore rules cover even
# where it does, is refused when the review starts, and changing the list
# invalidates the review evidence recorded under the old one:
#     context = ["docs/design-system.md", ".claude/skills/design-review/SKILL.md"]

# Triage asks TypeSafe Jev, a pinned judgment model, for advice only; it needs
# TYPESAFE_API_KEY in operator.env. filing: at yard ticket new, whether the
# ticket fits its workflow, spans more than one subsystem, or asks to
# investigate rather than change. shape: at each candidate head, whether the
# diff edits unrelated files or adds a module, option or fallback the ticket
# did not ask for. Neither selects, repairs or refuses anything.
[triage]
filing = true
shape = "advise"

# A workflow is a named binding of the knobs above, never a step language. A
# ticket selects one with yard ticket new --workflow NAME, and a ticket that
# names none runs "default"; yard help workflow says what one binds and how it
# is shown. Every workflow runs every gate, so none of them names a gate.
[workflows.default]
# implementer names the agent this workflow's lanes run their worker as.
implementer = "deepseek"
# review is a list of the seat names above, in panel order, or "none", for which
# no review execution is ever started -- its gates still run, and a review of
# "none" is as clean at the approval decision as a pass is.
review = ["code"]
# access grants the worker's workspace access: "writable" or "read-only".
access = "writable"
# inactivity_timeout_minutes and total_work_timeout_minutes are the job keys
# above, and mean the same here.
inactivity_timeout_minutes = 0
total_work_timeout_minutes = 360
# instructions adds your own standing guidance to every prompt this workflow's
# lanes carry, up to 16384 bytes.
instructions = """
Lanes run in a Linux container with no Apple container and no podman, so the
end-to-end suite cannot run here. cargo build, cargo fmt --check and
cargo clippy --all-targets are your checks. Write the end-to-end tests your
ticket names anyway, as AGENTS.md says; the operator runs them on the macOS
host before approving, against the sabotage each test's comment names.

Keep macOS-only code compiling on Linux, so clippy here checks it: choose the
runtime with cfg!(target_os = ...) in one place, and put code behind #[cfg]
only when it cannot compile elsewhere.

Before adding a function, config key, CLI option, label, event field or path,
search the tree for an existing one that fits (the core functions, the runtime
adapters, the helpers in the e2e crate) and reuse it; the commit message
states, in one sentence, what was reused or why nothing fit.
"""

# heavy is the default workflow with a stronger implementer, for a lane that
# adds a dependency or reworks a module: select it per ticket with
# yard ticket edit ID --workflow heavy.
[workflows.heavy]
implementer = "opus"
review = ["code"]
access = "writable"
inactivity_timeout_minutes = 0
total_work_timeout_minutes = 360
instructions = """
Lanes run in a Linux container with no Apple container and no podman, so the
end-to-end suite cannot run here. cargo build, cargo fmt --check and
cargo clippy --all-targets are your checks. Write the end-to-end tests your
ticket names anyway, as AGENTS.md says; the operator runs them on the macOS
host before approving, against the sabotage each test's comment names.

Keep macOS-only code compiling on Linux, so clippy here checks it: choose the
runtime with cfg!(target_os = ...) in one place, and put code behind #[cfg]
only when it cannot compile elsewhere.

Before adding a function, config key, CLI option, label, event field or path,
search the tree for an existing one that fits (the core functions, the runtime
adapters, the helpers in the e2e crate) and reuse it; the commit message
states, in one sentence, what was reused or why nothing fit.
"""

[workspace]
# build_artifacts names the directories ordinary build activity fills with
# output your .gitignore already covers: each a directory path relative to the
# repository root, not a pattern.
build_artifacts = ["target"]
