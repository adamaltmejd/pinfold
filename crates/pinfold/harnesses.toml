# The pinned harnesses, embedded in the binary at build time.
#
# An asset is a literal url and its sha256. install = "tar.gz" extracts
# the archive, whose one top-level entry is installed at `as`;
# install = "executable" installs the download itself at `as`, mode 0755.
# `as` is relative to <os-arch>/. `env` holds the harness's env defaults.
# A box os-arch is linux-arm64 or linux-x64; host-<os-arch> rows are host
# binaries, never mounted.

[[harness]]
name = "pi"
version = "1.5.0"
env = { PI_TELEMETRY = "0", PI_SKIP_VERSION_CHECK = "1" }

[[harness.asset]]
os-arch = "linux-arm64"
url = "https://github.com/earendil-works/pi/releases/download/v1.5.0/pi-linux-arm64.tar.gz"
sha256 = "5d5711b48600756473682e86360b026b11abf7591e5d112eb411d4da2c100d9a"
install = "tar.gz"
as = "pi"

[[harness.asset]]
os-arch = "linux-x64"
url = "https://github.com/earendil-works/pi/releases/download/v1.5.0/pi-linux-x64.tar.gz"
sha256 = "df870ba0e344cb7b3358d8d8f19397b8b8d225a8669784736ad68a5c2169d53b"
install = "tar.gz"
as = "pi"

