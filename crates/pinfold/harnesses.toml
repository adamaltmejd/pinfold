# The pinned harnesses, embedded in the binary at build time.
#
# An asset is a literal url and its sha256. install = "tar.gz" extracts
# the archive, whose one top-level entry is installed at `as`;
# install = "executable" installs the download itself at `as`, mode 0755.
# `as` is relative to <os-arch>/. `env` holds the harness's env defaults.
# A box os-arch is linux-arm64 or linux-x64; host-<os-arch> rows are host
# binaries, never mounted.

[[harness]]
name = "pi"
version = "1.2.0"
env = { PI_TELEMETRY = "0", PI_SKIP_VERSION_CHECK = "1" }

[[harness.asset]]
os-arch = "linux-arm64"
url = "https://github.com/earendil-works/pi/releases/download/v1.2.0/pi-linux-arm64.tar.gz"
sha256 = "d8597ee3a2050592d38e67f6b609ab55139deed7e820020d910d84f17bb7abd6"
install = "tar.gz"
as = "pi"

[[harness.asset]]
os-arch = "linux-x64"
url = "https://github.com/earendil-works/pi/releases/download/v1.2.0/pi-linux-x64.tar.gz"
sha256 = "00fc36cffdebceea5a48230da62cf3fb463178f8fe185766652f96002a246847"
install = "tar.gz"
as = "pi"

