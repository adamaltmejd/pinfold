# The pinned harnesses, embedded in the binary at build time.
#
# An asset is a literal url and its sha256. install = "tar.gz" extracts
# the archive, whose one top-level entry is installed at `as`;
# install = "executable" installs the download itself at `as`, mode 0755.
# `as` is relative to <os-arch>/. `env` holds the harness's env defaults.
# A box os-arch is linux-arm64 or linux-x64; host-<os-arch> rows are host
# binaries, never mounted.

[[harness]]
name = "pi"
version = "1.1.0"
env = { PI_TELEMETRY = "0", PI_SKIP_VERSION_CHECK = "1" }

[[harness.asset]]
os-arch = "linux-arm64"
url = "https://github.com/earendil-works/pi/releases/download/v1.1.0/pi-linux-arm64.tar.gz"
sha256 = "f3b0cac459f9df5420e4e48b48e95d81bfab57b701dd3fe4b08fda7d11d27dab"
install = "tar.gz"
as = "pi"

[[harness.asset]]
os-arch = "linux-x64"
url = "https://github.com/earendil-works/pi/releases/download/v1.1.0/pi-linux-x64.tar.gz"
sha256 = "3faa94666cd3849d37af320ff749407d0271b07a9b94f420c87e30866e10e289"
install = "tar.gz"
as = "pi"

