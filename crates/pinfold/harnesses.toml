# The pinned harnesses, embedded in the binary at build time.
#
# An asset is a literal url and its sha256. install = "tar.gz" extracts
# the archive, whose one top-level entry is installed at `as`;
# install = "executable" installs the download itself at `as`, mode 0755.
# `as` is relative to <os-arch>/. `env` holds the harness's env defaults.
# A box os-arch is linux-arm64 or linux-x64; host-<os-arch> rows are host
# binaries, never mounted.

[[harness]]
name = "pi"
version = "1.0.4"
env = { PI_TELEMETRY = "0", PI_SKIP_VERSION_CHECK = "1" }

[[harness.asset]]
os-arch = "linux-arm64"
url = "https://github.com/earendil-works/pi/releases/download/v1.0.4/pi-linux-arm64.tar.gz"
sha256 = "6a6bc66a6ac2750bd7ccd7f2109090463f564d447feefb10a5965f6b6aed2211"
install = "tar.gz"
as = "pi"

[[harness.asset]]
os-arch = "linux-x64"
url = "https://github.com/earendil-works/pi/releases/download/v1.0.4/pi-linux-x64.tar.gz"
sha256 = "284c45dd28cf975a13cff6af34741dd0a0cdca6634e8bdfc0083ae7d452e86d6"
install = "tar.gz"
as = "pi"

