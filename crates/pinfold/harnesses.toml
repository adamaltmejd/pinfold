# The pinned harnesses, embedded in the binary at build time.
#
# An asset is a literal url and its sha256. install = "tar.gz" extracts
# the archive, whose one top-level entry is installed at `as`;
# install = "executable" installs the download itself at `as`, mode 0755.
# `as` is relative to <os-arch>/. `env` holds the harness's env defaults.
# A box os-arch is linux-arm64 or linux-x64; host-<os-arch> rows are host
# binaries, never mounted.

[[harness]]
name = "pi"
version = "1.3.0"
env = { PI_TELEMETRY = "0", PI_SKIP_VERSION_CHECK = "1" }

[[harness.asset]]
os-arch = "linux-arm64"
url = "https://github.com/earendil-works/pi/releases/download/v1.3.0/pi-linux-arm64.tar.gz"
sha256 = "7fd2ea14fca390ebf9f47438baaef07c4b3d13db7cc8e459831118391b7ea65b"
install = "tar.gz"
as = "pi"

[[harness.asset]]
os-arch = "linux-x64"
url = "https://github.com/earendil-works/pi/releases/download/v1.3.0/pi-linux-x64.tar.gz"
sha256 = "24f5be328b66d4da36876296989501974f43ab8434fbb57c35c523a3ea505ded"
install = "tar.gz"
as = "pi"

