# The pinned Codex host helper, embedded in the binary at build time.
# Each tar.gz archive contains the executable installed at `as`, relative
# to <os-arch>/. These assets never enter a box.

[[host_helper]]
name = "codex"
version = "0.171.0"

[[host_helper.asset]]
os-arch = "host-darwin-arm64"
url = "https://github.com/openai/codex/releases/download/rust-v0.171.0/codex-app-server-aarch64-apple-darwin.tar.gz"
sha256 = "75690f1cc2ebd2ba71923dd52a69c3bf8bdbe6e0bc6c4861bb949cf977378b46"
install = "tar.gz"
as = "codex-app-server"

[[host_helper.asset]]
os-arch = "host-linux-x64"
url = "https://github.com/openai/codex/releases/download/rust-v0.171.0/codex-app-server-x86_64-unknown-linux-musl.tar.gz"
sha256 = "421bcd19b25b5e5b88fd851ddaba6a155c6f9adebae154a2821b73db12d03787"
install = "tar.gz"
as = "codex-app-server"
