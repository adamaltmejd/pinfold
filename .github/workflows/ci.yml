name: CI

on:
  push:
    branches: [main]
  pull_request:
  # scripts/e2e-linux.sh dispatches exact-ref checks at a temporary branch.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.runner }}, observation ${{ matrix.sample }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04]
        sample: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Rootless podman
        run: sh scripts/setup-linux-runner.sh

      - name: Rust musl target
        run: |
          # ring's C sources need the musl C compiler; the runner has none
          # until musl-tools is installed, and cc-rs looks for it under the
          # target's own name, so it is named for the target explicitly.
          sudo apt-get install -y -qq musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"

      # Dependencies' build output, per runner. Only main saves; temporary
      # checks/<sha> branches restore its cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ !inputs.ref && github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: End-to-end tests with temporary observations
        run: |
          mkdir -p target/issue-92
          podman info --format json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"store": d.get("store"), "version": d.get("version")}))' >target/issue-92/runtime.json
          python3 scripts/diagnose-suite-host.py >target/issue-92/host.jsonl &
          observer_pid=$!
          trap 'kill "$observer_pid" 2>/dev/null || true; wait "$observer_pid" || true' EXIT
          set +e
          /usr/bin/time -f 'elapsed=%e user=%U system=%S max_rss_kib=%M exit=%x' -o target/issue-92/command-time.txt cargo test -p e2e --locked -- --nocapture 2>&1 | tee target/issue-92/suite.log
          result=${PIPESTATUS[0]}
          set -e
          exit "$result"

      - name: Retain diagnostic evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-92-x64-${{ matrix.sample }}
          path: target/issue-92/
          retention-days: 14

      - name: Prototype Bun version
        id: tools
        run: |
          python3 scripts/bun-version.py >>"$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.tools.outputs.bun }}

      - name: Durable recovery preserves boxed execution
        working-directory: examples/pi-durable
        run: |
          bun install --frozen-lockfile
          bun run check
          bun durable_recovery_preserves_boxed_execution.ts \
            --pinfold "$GITHUB_WORKSPACE/target/$(uname -m)-unknown-linux-musl/debug/pinfold" \
            --image pinfold/profile-default:latest
