name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-builds:
    name: Podman build jobs ABBA (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Rootless podman
        run: sh scripts/setup-linux-runner.sh
      - name: Rust musl target
        run: |
          sudo apt-get install -y -qq musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Build baseline and sole-change prototype CLIs for measurement
        run: |
          mkdir -p target
          git diff a05deebec7ba532e17a5cf8b57c0aa9370b1fdca HEAD -- crates/pinfold profile Cargo.toml Cargo.lock >target/jobs-prototype.patch
          git show a05deebec7ba532e17a5cf8b57c0aa9370b1fdca:crates/pinfold/src/core/runtime/podman.rs >crates/pinfold/src/core/runtime/podman.rs
          cargo build -p pinfold --locked --target "$(uname -m)-unknown-linux-musl"
          cp "target/$(uname -m)-unknown-linux-musl/debug/pinfold" target/pinfold-jobs-A
          git restore crates/pinfold/src/core/runtime/podman.rs
          cargo build -p pinfold --locked --target "$(uname -m)-unknown-linux-musl"
          cp "target/$(uname -m)-unknown-linux-musl/debug/pinfold" target/pinfold-jobs-B
          git diff --exit-code
      - name: Four predetermined real builds and asset comparisons
        run: |
          python3 scripts/jobs-abba.py \
            --binary-a target/pinfold-jobs-A --binary-b target/pinfold-jobs-B \
            --source-revision "$(git rev-parse HEAD)" --outdir target/jobs-abba
      - name: Retain every observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-92-jobs-abba-${{ matrix.runner }}
          path: |
            target/jobs-abba/
            target/jobs-prototype.patch
          retention-days: 14
