name: Issue 92 perf report format check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Inspect distro perf report format on public zero bytes
        run: |
          set -euo pipefail
          mkdir -p evidence
          sudo apt-get update -qq
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)"
          command -v perf >evidence/location.txt
          ls -l "$(command -v perf)" >>evidence/location.txt
          perf --version >>evidence/location.txt
          scratch=$(mktemp -d)
          trap 'sudo rm -f "$scratch/perf.data" "$scratch/perf.data.old"; rmdir "$scratch"' EXIT
          sudo perf record -q -e cpu-clock:u -F 97 -o "$scratch/perf.data" -- \
            sh -c 'head -c 536870912 /dev/zero | sha256sum >/dev/null'
          sudo perf report --stdio --no-children --sort pid,comm,dso,symbol \
            --comms=sha256sum --field-separator=';' --percent-limit=0 \
            -i "$scratch/perf.data" >evidence/sorted-report.txt
          sudo perf report --stdio --no-children --fields overhead,pid,comm,dso,symbol \
            --comms=sha256sum --field-separator=';' --percent-limit=0 \
            -i "$scratch/perf.data" >evidence/explicit-report.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: issue-92-perf-format
          path: evidence/
          retention-days: 14
