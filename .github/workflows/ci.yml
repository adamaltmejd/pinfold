name: v0.2.6 final exact-head release builds
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Linux (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    env:
      PIN_EXPECTED_SHA: 3d49304b9c55a7a8605c870db02f178d7c35c985
      PIN_BUILD_TARGET: ${{ matrix.target }}
    steps:
      - name: Initialize retained outcomes
        run: |
          python3 - <<'PYCODE'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'pinfold-v026-final-build'; root.mkdir(parents=True, exist_ok=False)
          with Path(os.environ['GITHUB_ENV']).open('a') as stream:
              stream.write('PIN_EVIDENCE_ROOT='+str(root)+'\n')
          for name in ['source','final-source','outcomes']:
              (root/(name+'.json')).write_text(json.dumps({'status':'not-run','expected_sha':os.environ['PIN_EXPECTED_SHA']})+'\n')
          for name in ['build','stage']:
              (root/(name+'-result.json')).write_text(json.dumps({'status':'not-run'})+'\n')
          for name in []:
              (root/(name+'-inventory.json')).write_text(json.dumps({'status':'not-run'})+'\n')
          PYCODE
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 3d49304b9c55a7a8605c870db02f178d7c35c985
      - name: Verify frozen source
        id: source
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['PIN_EVIDENCE_ROOT']); root.mkdir(parents=True,exist_ok=True)
          result={'status':'error','expected_sha':os.environ['PIN_EXPECTED_SHA']}
          try:
              actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              dirty=subprocess.run(['git','diff','--quiet','HEAD','--'],check=False).returncode
              if dirty not in (0,1):
                  raise RuntimeError('source observation failed')
              untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z'])
              result.update(actual_sha=actual,tracked_source_clean=dirty==0,nonignored_untracked_count=len([name for name in untracked.split(b'\0') if name]))
              result['status']='verified' if actual==os.environ['PIN_EXPECTED_SHA'] and dirty==0 and not untracked else 'mismatch'
          except (OSError,subprocess.SubprocessError,RuntimeError) as error:
              result['error_type']=type(error).__name__
          finally:
              (root/'source.json').write_text(json.dumps(result,indent=2)+'\n')
          raise SystemExit(0 if result['status']=='verified' else 1)
          PYCODE
      - name: Rust musl target
        id: setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add "$PIN_BUILD_TARGET"
          target="$PIN_BUILD_TARGET"
          echo "CC_${target//-/_}=musl-gcc" >>"$GITHUB_ENV"
      - name: Build release target
        id: build
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess, time
          from pathlib import Path
          root=Path(os.environ['PIN_EVIDENCE_ROOT'])
          command=['cargo','build','-p','pinfold','--release','--locked','--target',os.environ['PIN_BUILD_TARGET']]
          began=time.monotonic_ns()
          (root/'build-result.json').write_text(json.dumps({'status':'started'})+'\n')
          try:
              with (root/'build.log').open('wb') as log:
                  completed=subprocess.run(command,stdout=log,stderr=subprocess.STDOUT,check=False)
          except OSError as error:
              (root/'build-result.json').write_text(json.dumps({'status':'spawn-failed','error_type':type(error).__name__})+'\n')
              raise
          elapsed=time.monotonic_ns()-began
          text=(root/'build.log').read_text(errors='replace')
          print(text,end='')
          (root/'build-result.json').write_text(json.dumps({'status':'complete','exit':completed.returncode,'elapsed_ns':elapsed})+'\n')
          raise SystemExit(completed.returncode)
          PYCODE
      - name: Stage built binary
        id: stage
        run: |
          python3 - <<'PYCODE'
          import hashlib, json, os, shutil
          from pathlib import Path
          root=Path(os.environ['PIN_EVIDENCE_ROOT']); target=os.environ['PIN_BUILD_TARGET']
          destination=root/'dist'/('pinfold-'+target); destination.parent.mkdir()
          shutil.copy2(Path('target')/target/'release/pinfold',destination)
          (root/'stage-result.json').write_text(json.dumps({'status':'complete','target':target,'filename':destination.name,'sha256':hashlib.sha256(destination.read_bytes()).hexdigest()})+'\n')
          PYCODE
      - name: Record final source and every step outcome
        if: always()
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])/'pinfold-v026-final-build'; root.mkdir(parents=True,exist_ok=True)
          result={'status':'error','steps':{'source': '${{ steps.source.outcome }}', 'setup': '${{ steps.setup.outcome }}', 'build': '${{ steps.build.outcome }}', 'stage': '${{ steps.stage.outcome }}'}}
          observation={'status':'error','expected_sha':os.environ['PIN_EXPECTED_SHA']}
          try:
              try:
                  result['source_verification']=json.loads((root/'source.json').read_text())
              except (OSError,ValueError) as error:
                  result['source_verification']={'status':'unavailable','error_type':type(error).__name__}
              actual=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
              dirty=subprocess.run(['git','diff','--quiet','HEAD','--'],check=False).returncode
              if dirty not in (0,1):
                  raise RuntimeError('source observation failed')
              untracked=subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z'])
              observation.update(actual_sha=actual,matches_expected=actual==os.environ['PIN_EXPECTED_SHA'],tracked_source_clean=dirty==0,nonignored_untracked_count=len([name for name in untracked.split(b'\0') if name]))
              observation['status']='verified' if observation['matches_expected'] and dirty==0 and not untracked else 'mismatch'
              result['status']=observation['status']
          except (OSError,subprocess.SubprocessError,RuntimeError) as error:
              observation['error_type']=type(error).__name__
          finally:
              result['final_source']=observation
              (root/'final-source.json').write_text(json.dumps(observation,indent=2)+'\n')
              (root/'outcomes.json').write_text(json.dumps(result,indent=2)+'\n')
          raise SystemExit(0 if observation['status']=='verified' else 1)
          PYCODE
      - name: Retain binary and all outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v026-final-build-${{ matrix.target }}
          path: ${{ runner.temp }}/pinfold-v026-final-build/
          if-no-files-found: error
          retention-days: 14
  macos:
    name: macOS (aarch64-apple-darwin)
