name: Issue 92 native graphroot tmpfs diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Native x64 ${{ matrix.mode }} sample ${{ matrix.sample }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        mode: [control, tmpfs]
        sample: [1, 2]
    env:
      ISSUE92_SAMPLE: ${{ matrix.sample }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Initialize all outcomes outside target
        run: |
          evidence="$RUNNER_TEMP/issue92-tmpfs"
          mkdir -p "$evidence"
          for gate in source prepare verification suite g35 g36 observer sampler cleanup; do
            printf '{"status":"not-run"}\n' >"$evidence/$gate-result.json"
          done
      - name: Freeze source and runner configuration
        run: |
          python3 scripts/issue92-tmpfs.py source '${{ matrix.mode }}'
          printf '{"status":"complete","exit":0}\n' >"$RUNNER_TEMP/issue92-tmpfs/source-result.json"
      - name: Prepare only the selected fresh graphroot
        run: |
          python3 scripts/issue92-tmpfs.py prepare '${{ matrix.mode }}'
          printf '{"status":"complete","exit":0}\n' >"$RUNNER_TEMP/issue92-tmpfs/prepare-result.json"
      - name: Original native rootless Podman setup
        run: sh scripts/setup-linux-runner.sh
      - name: Verify actual native storage
        run: |
          python3 scripts/issue92-tmpfs.py verify '${{ matrix.mode }}'
          printf '{"status":"complete","exit":0}\n' >"$RUNNER_TEMP/issue92-tmpfs/verification-result.json"
      - name: Ordinary fixture tools and musl target
        run: |
          sudo apt-get install -y -qq musl-tools openssl python3 iproute2
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Prototype Bun version
        id: tools
        run: python3 scripts/bun-version.py >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - name: Full suite, G35 and private-namespace G36
        run: |
          evidence="$RUNNER_TEMP/issue92-tmpfs"
          binary="$GITHUB_WORKSPACE/target/$(uname -m)-unknown-linux-musl/debug/pinfold"
          python3 scripts/diagnose-suite-host.py >"$evidence/host.jsonl" 2>"$evidence/observer.stderr" &
          observer_pid=$!
          python3 scripts/issue92-tmpfs.py sample '${{ matrix.mode }}' >"$evidence/df-memory.jsonl" 2>"$evidence/sampler.stderr" &
          sampler_pid=$!
          finish() {
            result=$?
            trap - EXIT
            set +e
            kill "$observer_pid" "$sampler_pid" 2>/dev/null || true
            wait "$observer_pid"; observer_result=$?
            wait "$sampler_pid"; sampler_result=$?
            printf '{"status":"complete","exit":%s}\n' "$observer_result" >"$evidence/observer-result.json"
            printf '{"status":"complete","exit":%s}\n' "$sampler_result" >"$evidence/sampler-result.json"
            if (( result != 0 || observer_result != 0 || sampler_result != 0 )); then exit 1; fi
          }
          trap finish EXIT
          set +e
          /usr/bin/time -f 'elapsed=%e user=%U system=%S max_rss_kib=%M exit=%x' \
            -o "$evidence/command-time.txt" cargo test -p e2e --locked -- --nocapture \
            >"$evidence/suite.log" 2>&1
          suite_result=$?
          printf '{"status":"complete","exit":%s}\n' "$suite_result" >"$evidence/suite-result.json"
          if [[ -f $binary ]]; then
            binary_hash=$(sha256sum "$binary" | cut -d' ' -f1)
            printf '{"status":"present","sha256":"%s"}\n' "$binary_hash" >"$evidence/binary.json"
            (
              cd examples/pi-durable &&
              bun install --frozen-lockfile &&
              bun run check &&
              bun durable_recovery_preserves_boxed_execution.ts \
                --pinfold "$binary" --image pinfold/profile-default:latest
            ) >"$evidence/g35.log" 2>&1
            g35_result=$?
            printf '{"status":"complete","exit":%s}\n' "$g35_result" >"$evidence/g35-result.json"
            bash scripts/slow-proxy.sh "$binary" >"$evidence/g36.log" 2>&1
            g36_result=$?
            printf '{"status":"complete","exit":%s}\n' "$g36_result" >"$evidence/g36-result.json"
          else
            g35_result=1
            g36_result=1
            printf '{"status":"absent"}\n' >"$evidence/binary.json"
            printf '{"status":"not-run","reason":"suite binary absent"}\n' >"$evidence/g35-result.json"
            printf '{"status":"not-run","reason":"suite binary absent"}\n' >"$evidence/g36-result.json"
          fi
          if (( suite_result != 0 || g35_result != 0 || g36_result != 0 )); then exit 1; fi
      - name: Verify source after all gates
        if: always()
        run: python3 scripts/issue92-tmpfs.py final-source '${{ matrix.mode }}'
      - name: Unmount only this job's graphroot
        if: always()
        run: |
          python3 scripts/issue92-tmpfs.py cleanup '${{ matrix.mode }}'
          printf '{"status":"complete","exit":0}\n' >"$RUNNER_TEMP/issue92-tmpfs/cleanup-result.json"
      - name: Retain setup, suite and cleanup outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue92-tmpfs-x64-${{ matrix.mode }}-${{ matrix.sample }}
          path: ${{ runner.temp }}/issue92-tmpfs/
          retention-days: 14
