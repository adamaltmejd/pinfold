name: v0.2.6 fixed scheduling ABBA diagnosis
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    name: Native x64 ABBA host ${{ matrix.host }}
    runs-on: ubuntu-26.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        host: [1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set evidence directory outside the restored cache
        run: echo "PINFOLD_SCHEDULING_EVIDENCE=$RUNNER_TEMP/pinfold-scheduling-evidence" >>"$GITHUB_ENV"
      - name: Verify frozen diagnostic source
        run: python3 scripts/release-scheduling-abba.py --verify-only
      - name: Original native rootless Podman setup
        run: sh scripts/setup-linux-runner.sh
      - name: Record native runtime
        run: |
          mkdir -p ${{ env.PINFOLD_SCHEDULING_EVIDENCE }}
          podman --version >${{ env.PINFOLD_SCHEDULING_EVIDENCE }}/podman-version.txt
          podman info --format json >${{ env.PINFOLD_SCHEDULING_EVIDENCE }}/runtime.json
          python3 - <<'PYCODE'
          import json, pathlib
          info=json.loads(pathlib.Path('${{ env.PINFOLD_SCHEDULING_EVIDENCE }}/runtime.json').read_text())
          assert info['host']['security']['rootless'] is True
          assert info['store']['graphDriverName']=='overlay'
          assert not info['store'].get('graphOptions',{}).get('overlay.mount_program')
          PYCODE
      - name: Rust musl target
        run: |
          sudo apt-get install -y -qq musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Prototype Bun version
        id: tools
        run: python3 scripts/bun-version.py >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - name: Four full suites and four G35 gates, fixed ABBA order
        run: python3 scripts/release-scheduling-abba.py
      - name: Retain all scheduled outcomes
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v026-scheduling-abba-x64-${{ matrix.host }}
          path: ${{ env.PINFOLD_SCHEDULING_EVIDENCE }}/
          retention-days: 14
