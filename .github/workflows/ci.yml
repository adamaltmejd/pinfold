name: CI

on:
  push:
    branches: [main]
  pull_request:
  # scripts/e2e-linux.sh dispatches exact-ref checks at a temporary branch.
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  linux:
    name: Linux (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Rootless podman
        run: |
          # AppArmor's unprivileged-userns restriction is enabled on the
          # runner image and denies rootless podman the user namespace it
          # creates. The runner is disposable, so clearing it is enough.
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

          # podman needs an active systemd user session to enforce --cpus and
          # --memory; under cgroupfs it silently ignores both and pinfold's
          # preflight refuses every box. The image enables linger, but not the
          # session D-Bus.
          sudo apt-get update -qq
          sudo apt-get install -y -qq dbus-user-session
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"

          XDG_RUNTIME_DIR="/run/user/$(id -u)"
          DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          export XDG_RUNTIME_DIR DBUS_SESSION_BUS_ADDRESS
          systemctl --user daemon-reload
          systemctl --user enable --now dbus.socket
          podman system migrate

          {
            echo "XDG_RUNTIME_DIR=$XDG_RUNTIME_DIR"
            echo "DBUS_SESSION_BUS_ADDRESS=$DBUS_SESSION_BUS_ADDRESS"
          } >>"$GITHUB_ENV"

      - name: Rust musl target
        run: |
          # ring's C sources need the musl C compiler; the runner has none
          # until musl-tools is installed, and cc-rs looks for it under the
          # target's own name, so it is named for the target explicitly.
          sudo apt-get install -y -qq musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"

      # Dependencies' build output, per runner. Only main saves; temporary
      # checks/<sha> branches restore its cache.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ !inputs.ref && github.ref == 'refs/heads/main' }}

      - name: Format
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: End-to-end tests
        run: cargo test -p e2e --locked

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.10.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Durable recovery preserves boxed execution
        working-directory: examples/pi-durable
        run: |
          bun install --frozen-lockfile
          bun run check
          node durable_recovery_preserves_boxed_execution.ts \
            --pinfold "$GITHUB_WORKSPACE/target/$(uname -m)-unknown-linux-musl/debug/pinfold" \
            --image pinfold/profile-default:latest
