name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  profile-builds:
    name: Profile asset-stage ABBA (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-26.04, ubuntu-26.04-arm]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rootless podman
        run: sh scripts/setup-linux-runner.sh
      - name: Rust musl target
        run: |
          sudo apt-get install -y -qq musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - name: Build the unchanged production CLI for measurement
        run: cargo build -p pinfold --locked --target "$(uname -m)-unknown-linux-musl"
      - name: Four predetermined real builds and asset comparisons
        run: |
          python3 scripts/profile-abba.py \
            --binary "target/$(uname -m)-unknown-linux-musl/debug/pinfold" \
            --source-revision "$(git rev-parse HEAD)" --outdir target/profile-abba
      - name: Retain every observation
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: issue-92-profile-abba-${{ matrix.runner }}
          path: target/profile-abba/
          retention-days: 14
