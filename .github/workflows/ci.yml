name: v0.2.6 fixed scheduling acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  round_1:
    strategy:
      fail-fast: false
      matrix:
        case: [x64-normal, x64-coldmusl, arm-normal]
    uses: ./.github/workflows/v026-acceptance-cell.yml
    with:
      source_sha: 3d49304b9c55a7a8605c870db02f178d7c35c985
      round: 1
      case: ${{ matrix.case }}
  round_2:
    needs: [round_1]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        case: [x64-normal, x64-coldmusl, arm-normal]
    uses: ./.github/workflows/v026-acceptance-cell.yml
    with:
      source_sha: 3d49304b9c55a7a8605c870db02f178d7c35c985
      round: 2
      case: ${{ matrix.case }}
  round_3:
    needs: [round_2]
    if: always()
    strategy:
      fail-fast: false
      matrix:
        case: [x64-normal, x64-coldmusl, arm-normal]
    uses: ./.github/workflows/v026-acceptance-cell.yml
    with:
      source_sha: 3d49304b9c55a7a8605c870db02f178d7c35c985
      round: 3
      case: ${{ matrix.case }}
