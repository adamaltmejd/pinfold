name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      base:
        required: true
        type: string

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Workspace version
        id: version
        env:
          CANDIDATE_REF: ${{ inputs.ref }}
        run: |
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          if [ -z "$CANDIDATE_REF" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "tag $GITHUB_REF_NAME is not v$version" >&2
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"

  build:
    name: Linux (${{ matrix.target }})
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-26.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Rust musl target
        run: |
          # ring's C sources need the musl C compiler (see ci.yml).
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          rustup target add "${{ matrix.target }}"
          target="${{ matrix.target }}"
          echo "CC_${target//-/_}=musl-gcc" >>"$GITHUB_ENV"

      - name: Build
        run: cargo build -p pinfold --release --locked --target "${{ matrix.target }}"

      - name: Stage
        run: |
          mkdir dist
          cp "target/${{ matrix.target }}/release/pinfold" \
            "dist/pinfold-${{ needs.version.outputs.version }}-${{ matrix.target }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/pinfold-*
          if-no-files-found: error

  macos:
    name: macOS (aarch64-apple-darwin)
    needs: version
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      # build.rs cross-builds the embedded Linux init with cargo zigbuild,
      # so the macOS build needs zig, cargo-zigbuild and the musl target.
      # Homebrew's zig is unpinned; if cargo-zigbuild stops accepting it,
      # pin both here.
      - name: Zig and the init target
        run: |
          brew install zig cargo-zigbuild
          rustup target add aarch64-unknown-linux-musl

      - name: Build
        run: cargo build -p pinfold --release --locked --target aarch64-apple-darwin

      - name: Stage
        run: |
          mkdir dist
          cp target/aarch64-apple-darwin/release/pinfold \
            "dist/pinfold-${{ needs.version.outputs.version }}-aarch64-apple-darwin"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aarch64-apple-darwin
          path: dist/pinfold-*
          if-no-files-found: error

  release:
    name: Release
    needs: [version, build, macos]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # gh's --notes-from-tag reads the tag annotation from the local
      # checkout and refuses --repo, so the repo is inferred from origin.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 2

      # checkout writes the tag ref as the bare commit (--no-tags),
      # so the local tag is lightweight and gh would fall back to the commit
      # message. Fetch the annotated tag object.
      - name: Fetch annotated tag
        if: ${{ !inputs.ref }}
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum pinfold-* >SHA256SUMS

      - name: Promote tested pin update
        if: ${{ inputs.ref != '' }}
        env:
          BASE: ${{ inputs.base }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ "$(git rev-parse HEAD^)" != "$BASE" ]; then
            echo "candidate parent differs from its tested base" >&2
            exit 1
          fi
          git fetch origin refs/heads/main:refs/remotes/origin/main
          if [ "$(git rev-parse origin/main)" != "$BASE" ]; then
            echo "main changed while the candidate was being checked" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'Nightly harness and image-tool pin update.\n\n## Caller changes\n\nNone\n' > /tmp/pinfold-release-notes
          git tag -a "v$VERSION" --cleanup=verbatim -F /tmp/pinfold-release-notes
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$VERSION"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            --notes-from-tag \
            dist/pinfold-* dist/SHA256SUMS
