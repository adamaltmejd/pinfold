name: Slow proxy proof

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  connect:
    name: CONNECT (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Firecracker host requirements and fixture tools
        run: |
          sh scripts/setup-linux-runner.sh
          sudo apt-get install -y -qq musl-tools openssl python3 iproute2

      - name: Rust musl target
        run: |
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false

      - name: Build the real binary
        run: cargo build -p pinfold --locked --target "$(uname -m)-unknown-linux-musl"

      # The executable the gate runs, profiled with the restriction on.
      - name: AppArmor profile
        run: |
          target/"$(uname -m)"-unknown-linux-musl/debug/pinfold apparmor-profile >"$RUNNER_TEMP/pinfold"
          sudo install -m 0644 "$RUNNER_TEMP/pinfold" /etc/apparmor.d/pinfold
          sudo apparmor_parser -r /etc/apparmor.d/pinfold
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1

      - name: CONNECT tunnels share activity
        run: bash scripts/slow-proxy.sh "$PWD/target/$(uname -m)-unknown-linux-musl/debug/pinfold"
