name: Nightly pins

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      check_runner:
        description: Check the dedicated Mac and run its suite without updating pins or releasing
        type: boolean
        default: false
      install_tools:
        description: Install missing build tools on the Mac during a runner check
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly-pins
  cancel-in-progress: false

jobs:
  prepare:
    if: vars.PINFOLD_AUTO_RELEASES == 'true' && !inputs.check_runner
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.candidate.outputs.ref }}
      base: ${{ steps.candidate.outputs.base }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0

      - name: Update harness and image-tool pins
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/bump-pins.py

      - name: Prepare changed pins
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- profile/Containerfile crates/pinfold/harnesses.toml; then
            echo "Pins are current."
            exit 0
          fi

          # Automatic notes promise no caller changes. Unreleased implementation
          # changes must first go through the operator's release pass.
          tag=$(gh release view --json tagName --jq .tagName)
          if ! git diff --quiet "$tag" HEAD -- crates profile scripts/bump-pins.py Cargo.toml Cargo.lock rust-toolchain.toml; then
            echo "Unreleased implementation changes since $tag; release them manually first." >&2
            exit 1
          fi

          base=$(git rev-parse HEAD)
          python3 - <<'PY'
          from pathlib import Path
          import re
          import tomllib

          path = Path("Cargo.toml")
          old = tomllib.loads(path.read_text())["workspace"]["package"]["version"]
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", old):
              raise SystemExit("nightly pins requires a stable workspace version")
          major, minor, patch = map(int, old.split("."))
          new = f"{major}.{minor}.{patch + 1}"
          path.write_text(path.read_text().replace(f'version = "{old}"', f'version = "{new}"', 1))
          lock = Path("Cargo.lock")
          text = lock.read_text()
          for manifest in Path("crates").glob("*/Cargo.toml"):
              name = tomllib.loads(manifest.read_text())["package"]["name"]
              pattern = rf'(\[\[package\]\]\nname = "{re.escape(name)}"\nversion = "){re.escape(old)}(")'
              text, count = re.subn(pattern, lambda m: m[1] + new + m[2], text)
              if count != 1:
                  raise SystemExit(f"cannot update workspace lock entry for {name}")
          lock.write_text(text)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/Containerfile crates/pinfold/harnesses.toml Cargo.toml Cargo.lock
          git commit -m "chore: update harness and image-tool pins"
          ref=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/checks/pins-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "ref=$ref" >>"$GITHUB_OUTPUT"
          echo "base=$base" >>"$GITHUB_OUTPUT"

  validate:
    needs: prepare
    if: needs.prepare.outputs.ref != ''
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}

  macos:
    needs: prepare
    if: always() && (inputs.check_runner || needs.prepare.outputs.ref != '')
    runs-on: [self-hosted, macOS, ARM64, pinfold-nightly]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ needs.prepare.outputs.ref || github.sha }}
          persist-credentials: false
      - name: Runner tool paths
        run: |
          printf '%s\n' "$HOME/.cargo/bin" /opt/homebrew/bin /usr/local/bin /opt/homebrew/opt/rustup/bin >>"$GITHUB_PATH"
      - name: Install runner build tools
        if: inputs.check_runner && inputs.install_tools
        run: |
          missing=()
          for tool in rustup zig cargo-zigbuild; do
            if ! command -v "$tool" >/dev/null; then missing+=("$tool"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then brew install "${missing[@]}"; fi
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          "$(brew --prefix rustup)/bin/rustup" toolchain install "$toolchain" \
            --profile minimal --component rustfmt --component clippy \
            --target aarch64-unknown-linux-musl
          if ! container system status; then
            container system start --enable-kernel-install
          fi
      - name: Runner readiness
        run: |
          sw_vers
          uname -m
          id -un
          missing=0
          for tool in brew cargo rustup zig cargo-zigbuild container; do
            if ! command -v "$tool"; then
              echo "Missing tool: $tool" >&2
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then exit 1; fi
          rustup show active-toolchain
          zig version
          cargo-zigbuild --version
          container --version
          container system status
      - name: Reclaim dedicated CI caches
        run: sh scripts/clean-mac-runner.sh
      - name: Require disk headroom
        run: |
          available_kb=$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 {print $4}')
          if [ "$available_kb" -lt 20971520 ]; then
            echo 'Mac runner needs at least 20 GiB free before builds.' >&2
            exit 1
          fi
      - name: Full Mac end-to-end suite, including live login
        env:
          CARGO_TARGET_AARCH64_APPLE_DARWIN_RUNNER: sh ${{ github.workspace }}/scripts/run-mac-e2e.sh
        run: |
          toolchain=$(sed -n 's/^channel = "\([^"]*\)"$/\1/p' rust-toolchain.toml)
          rustup run "$toolchain" cargo test -p e2e --locked
      - name: Reclaim caches after success or failure
        if: always()
        run: sh scripts/clean-mac-runner.sh

  release:
    needs: [prepare, validate, macos]
    if: needs.prepare.outputs.ref != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.prepare.outputs.ref }}
      base: ${{ needs.prepare.outputs.base }}

  cleanup:
    needs: [prepare, validate, release]
    if: always()
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Delete candidate branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="checks/pins-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" >/dev/null 2>&1; then
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
          fi
