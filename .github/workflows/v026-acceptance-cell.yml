name: v0.2.6 fixed scheduling acceptance cell
on:
  workflow_call:
    inputs:
      source_sha:
        required: true
        type: string
      round:
        required: true
        type: number
      case:
        required: true
        type: string
permissions:
  contents: read
jobs:
  linux:
    name: Round ${{ inputs.round }} / ${{ inputs.case }}
    runs-on: ${{ inputs.case == 'arm-normal' && 'ubuntu-26.04-arm' || 'ubuntu-26.04' }}
    timeout-minutes: 20
    steps:
      - name: Initialize every scheduled outcome before checkout
        run: |
          mkdir -p "$RUNNER_TEMP/v026-acceptance"
          for outcome in suite-result g35-result runtime-result final-source source-host initial-inventory-result post-suite-inventory-result post-g35-inventory-result; do
            printf '{"status":"not-run"}\n' >"$RUNNER_TEMP/v026-acceptance/$outcome.json"
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
      - name: Freeze source and record host
        run: |
          test '${{ inputs.source_sha }}' = '3d49304b9c55a7a8605c870db02f178d7c35c985'
          test "$(git rev-parse HEAD)" = '3d49304b9c55a7a8605c870db02f178d7c35c985'
          git diff --quiet HEAD --
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          root=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance')
          command=lambda *args: subprocess.check_output(args,text=True).strip()
          assert '${{ inputs.case }}' in ('x64-normal','x64-coldmusl','arm-normal')
          assert ${{ inputs.round }} in (1,2,3)
          assert not subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z'])
          diagnostic_paths=('crates/e2e/src/timing.rs','scripts/diagnose-suite-host.py',
                            'scripts/issue92-phase-source-guard.py','scripts/release-scheduling-abba.py',
                            'scripts/release-scheduling-variants.json')
          assert not any(pathlib.Path(name).exists() for name in diagnostic_paths)
          assert not any(b'timing::Span' in path.read_bytes() for path in pathlib.Path('crates/e2e').rglob('*.rs'))
          budget_sha=hashlib.sha256(pathlib.Path('scripts/e2e-budget.py').read_bytes()).hexdigest()
          assert budget_sha=='e3f340f637514b24e900c203e9cc0ad955fb3f43e843acfc154f756fb47e69a3'
          capture_present=bool(os.environ.get('RUST_TEST_NOCAPTURE'))
          assert not capture_present
          models=sorted({line.split(':',1)[1].strip() for line in pathlib.Path('/proc/cpuinfo').read_text().splitlines() if line.startswith(('model name','Hardware'))})
          config=pathlib.Path('.cargo/config.toml')
          cpu_max=pathlib.Path('/sys/fs/cgroup/cpu.max')
          result={'commit':command('git','rev-parse','HEAD'),
                  'accepted_candidate':'3d49304b9c55a7a8605c870db02f178d7c35c985',
                  'validation_driver':'${{ github.sha }}','workflow_sha':'${{ github.workflow_sha }}',
                  'budget_wrapper_sha256':budget_sha,'diagnostic_capture_present':capture_present,
                  'tree':command('git','rev-parse','HEAD^{tree}'),
                  'cargo_toml_sha256':hashlib.sha256(pathlib.Path('Cargo.toml').read_bytes()).hexdigest(),
                  'cargo_lock_sha256':hashlib.sha256(pathlib.Path('Cargo.lock').read_bytes()).hexdigest(),
                  'cargo_config_exists':config.exists(),
                  'cargo_config_sha256':hashlib.sha256(config.read_bytes()).hexdigest() if config.exists() else None,
                  'architecture':platform.machine(),'kernel':platform.release(),
                  'model':models,'affinity_cpus':sorted(os.sched_getaffinity(0)),
                  'cgroup_cpu_max':cpu_max.read_text().strip() if cpu_max.exists() else None,
                  'cgroup_cpu_max_scope':'visible mount root only; not effective CPU quota',
                  'rustc_version':command('rustc','--version'),
                  'cargo_version':command('cargo','--version'),
                  'worker_env_overrides_present':{key:bool(os.environ.get(key)) for key in ('RUST_TEST_THREADS','CARGO_BUILD_JOBS','CARGO_TARGET_DIR')},
                  'case':'${{ inputs.case }}','round':${{ inputs.round }}}
          (root/'source-host.json').write_text(json.dumps(result,indent=2)+'\n')
          assert len(result['affinity_cpus'])==4
          assert not any(result['worker_env_overrides_present'].values())
          PY
      - name: Rootless podman
        run: sh scripts/setup-linux-runner.sh
      - name: Record runtime version
        run: podman --version >"$RUNNER_TEMP/v026-acceptance/podman-version.txt"
      - name: Record and verify actual ordinary runtime backing
        run: |
          python3 - <<'PY_RUNTIME'
          import json, os, pathlib, platform, subprocess
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance'
          info=json.loads(subprocess.check_output(['podman','info','--format','json'],timeout=90))
          (root/'runtime.json').write_text(json.dumps(info,indent=2)+'\n')
          store=info['store']
          graph=pathlib.Path(store['graphRoot'])
          mount=json.loads(subprocess.check_output(['findmnt','--json','--target',str(graph),'-o','TARGET,FSTYPE,SOURCE,OPTIONS'],timeout=10))
          fs=os.statvfs(graph)
          result={'status':'observed','architecture':platform.machine(),'mount':mount,
                  'graphroot':str(graph),'runroot':store['runRoot'],'capacity_bytes':fs.f_blocks*fs.f_frsize}
          (root/'runtime-result.json').write_text(json.dumps(result,indent=2)+'\n')
          assert info['host']['security']['rootless'] is True
          assert graph==pathlib.Path.home()/'.local/share/containers/storage'
          assert store['runRoot']==f'/run/user/{os.getuid()}/containers'
          assert store['graphDriverName']=='overlay' and not store['transientStore']
          assert store['graphOptions'].get('overlay.mountopt')=='nodev'
          assert not store['graphOptions'].get('overlay.mount_program')
          assert store['graphStatus']['Native Overlay Diff']=='true'
          mounts=mount['filesystems']
          assert len(mounts)==1
          if platform.machine()=='x86_64':
              assert os.environ.get('GITHUB_ACTIONS')=='true' and os.environ.get('RUNNER_ENVIRONMENT')=='github-hosted'
              assert mounts[0]['target']==str(graph) and mounts[0]['fstype']=='tmpfs'
              assert store['graphStatus']['Backing Filesystem']=='tmpfs'
              assert result['capacity_bytes']==6*1024**3
          else:
              assert platform.machine()=='aarch64' and mounts[0]['fstype']!='tmpfs'
              assert store['graphStatus']['Backing Filesystem']=='extfs'
          result['status']='complete'
          result['exit']=0
          (root/'runtime-result.json').write_text(json.dumps(result,indent=2)+'\n')
          PY_RUNTIME
      - name: Require empty native owned-box inventory before the suite
        id: initial_inventory
        run: |
          python3 - <<'PY_INVENTORY'
          import json, os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance'
          result={'status':'error','exit':1,'phase':'initial'}
          try:
              raw=subprocess.check_output(['podman','ps','--all','--filter','label=dev.pinfold.owner','--format','json'],timeout=90)
              values=json.loads(raw)
              (root/'initial-inventory.json').write_text(json.dumps(values,indent=2)+'\n')
              result.update(status='complete',exit=0 if values==[] else 1,empty=values==[])
          except (OSError,subprocess.SubprocessError,ValueError,UnicodeError) as error:
              result['error_type']=type(error).__name__
          finally:
              (root/'initial-inventory-result.json').write_text(json.dumps(result,indent=2)+'\n')
          sys.exit(result['exit'])
          PY_INVENTORY
      - name: Rust musl target
        run: |
          sudo apt-get install -y -qq musl-tools
          rustup target add "$(uname -m)-unknown-linux-musl"
          echo "CC_$(uname -m)_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        id: rust_cache
        with:
          save-if: false
      - name: Record restored cache state
        env:
          RUST_CACHE_HIT: ${{ steps.rust_cache.outputs.cache-hit }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform
          target=pathlib.Path('target')
          triple=platform.machine()+'-unknown-linux-musl'
          musl=target/triple
          result={'target_exists_after_restore':target.exists(),
                  'musl_target_exists_after_restore':musl.exists(),
                  'host_debug_exists_after_restore':(target/'debug').exists(),
                  'cache_hit_semantics':'exact-match only; false or unavailable does not prove no restore',
                  'rust_cache_hit_output':os.environ.get('RUST_CACHE_HIT') or None}
          (pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance'/'cache-after-restore.json').write_text(json.dumps(result,indent=2)+'\n')
          PY
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Record cache then optionally remove only musl target
        run: |
          python3 - <<'PY'
          import json, os, pathlib, platform
          triple=platform.machine()+'-unknown-linux-musl'
          path=pathlib.Path('target')/triple
          ((pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance')/'cache-before-suite.json').write_text(
              json.dumps({'musl_target_dir':str(path),'exists_after_cache_and_lint':path.exists()},indent=2)+'\n')
          PY
          if [ '${{ inputs.case }}' = 'x64-coldmusl' ]; then
            test "$(uname -m)" = x86_64
            rm -rf -- target/x86_64-unknown-linux-musl
          fi
          python3 - <<'PY_COLD'
          import json, os, pathlib, platform
          path=pathlib.Path('target')/(platform.machine()+'-unknown-linux-musl')
          cold='${{ inputs.case }}'=='x64-coldmusl'
          result={'case':'${{ inputs.case }}','cold_musl_requested':cold,
                  'musl_target_dir':str(path),'exists_immediately_before_timer':path.exists()}
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance'
          (root/'cache-after-cold-selection.json').write_text(json.dumps(result,indent=2)+'\n')
          assert not cold or not path.exists(), 'cold musl target still exists'
          PY_COLD
      - name: Complete full e2e suite, then judge budget
        id: e2e
        run: |
          set +e
          python3 scripts/e2e-budget.py 2>&1 | tee "$RUNNER_TEMP/v026-acceptance/suite.log"
          gate_status=${PIPESTATUS[0]}
          set -e
          GATE_STATUS="$gate_status" python3 - <<'PY'
          import json, os, pathlib, re, sys
          root=(pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance')
          lines=(root/'suite.log').read_text(errors='replace').splitlines()
          markers=[]
          for line in lines:
              try: item=json.loads(line)
              except json.JSONDecodeError: continue
              if isinstance(item,dict) and set(item)=={'e2e_elapsed_ns','e2e_exit'}:
                  markers.append(item)
          result={'status':'complete' if len(markers)==1 else 'missing-or-duplicate-marker',
                  'gate_exit':int(os.environ['GATE_STATUS']),
                  'command':['cargo','test','-p','e2e','--locked'],
                  'libtest_result_lines':[line for line in lines if line.startswith('test result:')]}
          if len(markers)==1:
              result.update(markers[0])
              result['under_300']=result['e2e_elapsed_ns']<300_000_000_000
              result['normal_x64_at_most_270']=result['e2e_elapsed_ns']<=270_000_000_000 if '${{ inputs.case }}'=='x64-normal' else None
          (root/'suite-result.json').write_text(json.dumps(result,indent=2)+'\n')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              print('complete='+('true' if len(markers)==1 else 'false'),file=output)
          if len(markers)!=1 or result['gate_exit'] or result.get('e2e_exit') or not result.get('under_300') or result.get('normal_x64_at_most_270') is False:
              sys.exit(1)
          PY
      - name: Require empty native owned-box inventory before G35
        id: post_suite_inventory
        if: ${{ !cancelled() && steps.e2e.outcome != 'skipped' }}
        run: |
          python3 - <<'PY_INVENTORY'
          import json, os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance'
          result={'status':'error','exit':1,'phase':'post-suite'}
          try:
              raw=subprocess.check_output(['podman','ps','--all','--filter','label=dev.pinfold.owner','--format','json'],timeout=90)
              values=json.loads(raw)
              (root/'post-suite-inventory.json').write_text(json.dumps(values,indent=2)+'\n')
              result.update(status='complete',exit=0 if values==[] else 1,empty=values==[])
          except (OSError,subprocess.SubprocessError,ValueError,UnicodeError) as error:
              result['error_type']=type(error).__name__
          finally:
              (root/'post-suite-inventory-result.json').write_text(json.dumps(result,indent=2)+'\n')
          sys.exit(result['exit'])
          PY_INVENTORY
      - name: Prototype Bun version
        id: tools
        if: ${{ !cancelled() && steps.e2e.outputs.complete == 'true' && steps.post_suite_inventory.outcome == 'success' }}
        run: python3 scripts/bun-version.py >>"$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        id: bun
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        with:
          bun-version: ${{ steps.tools.outputs.bun }}
      - name: Durable recovery preserves boxed execution
        id: g35
        if: ${{ !cancelled() && steps.e2e.outputs.complete == 'true' && steps.post_suite_inventory.outcome == 'success' && steps.bun.outcome == 'success' }}
        working-directory: examples/pi-durable
        run: |
          set +e
          {
            bun install --frozen-lockfile &&
            bun run check &&
            bun durable_recovery_preserves_boxed_execution.ts \
              --pinfold "$GITHUB_WORKSPACE/target/$(uname -m)-unknown-linux-musl/debug/pinfold" \
              --image pinfold/profile-default:latest
          } >"$RUNNER_TEMP/v026-acceptance/g35.log" 2>&1
          result=$?
          cat "$RUNNER_TEMP/v026-acceptance/g35.log"
          printf '{"status":"complete","exit":%s}\n' "$result" >"$RUNNER_TEMP/v026-acceptance/g35-result.json"
          exit "$result"
      - name: Require empty native owned-box inventory after G35
        id: post_g35_inventory
        if: ${{ !cancelled() && steps.g35.outcome != 'skipped' }}
        run: |
          python3 - <<'PY_INVENTORY'
          import json, os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance'
          result={'status':'error','exit':1,'phase':'post-g35'}
          try:
              raw=subprocess.check_output(['podman','ps','--all','--filter','label=dev.pinfold.owner','--format','json'],timeout=90)
              values=json.loads(raw)
              (root/'post-g35-inventory.json').write_text(json.dumps(values,indent=2)+'\n')
              result.update(status='complete',exit=0 if values==[] else 1,empty=values==[])
          except (OSError,subprocess.SubprocessError,ValueError,UnicodeError) as error:
              result['error_type']=type(error).__name__
          finally:
              (root/'post-g35-inventory-result.json').write_text(json.dumps(result,indent=2)+'\n')
          sys.exit(result['exit'])
          PY_INVENTORY
      - name: Record final fixed source and clean state
        if: always()
        run: |
          python3 - <<'PY_FINAL'
          import json, os, pathlib, subprocess, sys
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'v026-acceptance'
          root.mkdir(parents=True,exist_ok=True)
          result={'status':'error','exit':1,'expected':'3d49304b9c55a7a8605c870db02f178d7c35c985',
                  'validation_driver':'${{ github.sha }}'}
          try:
              head=subprocess.check_output(['git','rev-parse','HEAD'],text=True,stderr=subprocess.PIPE).strip()
              tracked=subprocess.run(['git','diff','--quiet','HEAD','--'],stderr=subprocess.PIPE)
              if tracked.returncode not in (0,1):
                  raise subprocess.CalledProcessError(tracked.returncode,tracked.args)
              tracked_clean=tracked.returncode==0
              untracked_clean=not subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z'],stderr=subprocess.PIPE)
              result.update(status='complete',head=head,tracked_clean=tracked_clean,untracked_clean=untracked_clean)
              result['exit']=0 if head==result['expected'] and tracked_clean and untracked_clean else 1
          except (OSError,subprocess.SubprocessError) as error:
              result['error_type']=type(error).__name__
          finally:
              (root/'final-source.json').write_text(json.dumps(result,indent=2)+'\n')
          sys.exit(result['exit'])
          PY_FINAL
      - name: Upload every cell outcome
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: v026-r${{ inputs.round }}-${{ inputs.case }}
          path: ${{ runner.temp }}/v026-acceptance/
          retention-days: 14
          if-no-files-found: error
