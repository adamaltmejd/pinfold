name: Slow response proof

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read

jobs:
  response:
    name: Blocked response (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Firecracker host requirements
        run: sh scripts/setup-linux-runner.sh

      - name: Rust musl target
        run: |
          sudo apt-get install -y -qq musl-tools
          rustup target add x86_64-unknown-linux-musl
          echo "CC_x86_64_unknown_linux_musl=musl-gcc" >>"$GITHUB_ENV"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ !inputs.ref && github.ref == 'refs/heads/main' }}

      - name: AppArmor profile
        run: |
          cargo build -p pinfold --locked --release --target x86_64-unknown-linux-musl
          target/x86_64-unknown-linux-musl/release/pinfold apparmor-profile >"$RUNNER_TEMP/pinfold"
          sudo install -m 0644 "$RUNNER_TEMP/pinfold" /etc/apparmor.d/pinfold
          sudo apparmor_parser -r /etc/apparmor.d/pinfold
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = 1

      - name: Blocked responses release the upstream
        run: cargo test -p e2e --locked --test e2e box_::blocked_route_responses_release_the_upstream -- --ignored --exact --nocapture
